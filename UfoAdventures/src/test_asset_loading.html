<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXI.js Asset Loading Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.0/pixi.min.js?v=1"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        canvas { display: block; margin: 50px auto; border: 1px solid white; }
    </style>
</head>
<body>
    <canvas id="testCanvas" width="400" height="300"></canvas>

    <script>
        async function runTest() {
            const app = new PIXI.Application({
                width: 400,
                height: 300,
                backgroundColor: 0x666666,
                view: document.getElementById('testCanvas'),
            });

            try {
                console.log('Attempting to load amidogus asset...');
                await PIXI.Assets.load({ src: 'images/Statics/02_Amidogus.png', alias: 'amidogus' });
                console.log('Amidogus asset loaded successfully.');

                const sprite = new PIXI.Sprite(PIXI.Assets.get('amidogus'));
                sprite.anchor.set(0.5);
                sprite.x = app.screen.width / 2;
                sprite.y = app.screen.height / 2;
                app.stage.addChild(sprite);

                console.log('Sprite added to stage.');

            } catch (error) {
                console.error('Error during asset loading test:', error);
            }
        }

        runTest();
    </script>
</body>
</html>
