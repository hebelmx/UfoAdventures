<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0">
    <title>Adriel's Game - UFO Adventures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.0/pixi.min.js?v=1"></script>
    <div style="color: white; text-align: center; padding: 10px; background-color: black;">UFO Adventures - Test Banner</div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="ui-panel">
                <div>Health:</div>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill"></div>
                </div>
                <div>Combo: <span id="comboCount">0</span></div>
                <div class="combo-bar">
                    <div class="combo-fill" id="comboFill"></div>
                </div>
                <div>Lives:</div>
                <div class="lives-display" id="livesDisplay">
                    <div class="life-icon"></div>
                    <div class="life-icon"></div>
                    <div class="life-icon"></div>
                </div>
            </div>
        </div>
        <!-- Boss Health Bar -->
        <div class="boss-health-bar" id="bossHealthBar" style="display: none;">
            <div class="boss-health-fill" id="bossHealthFill"></div>
            <div class="boss-name" id="bossName">TARAK - Gothic Dragon King</div>
        </div>
        <!-- Game Messages -->
        <div class="game-messages" id="gameMessages"></div>
        <!-- Controls -->
        <div class="controls-panel">
            <div><strong>Controls:</strong></div>
            <div>Move: WASD / Arrow Keys</div>
            <div>Jump: W / Space</div>
            <div>Attack: J / Left Click</div>
            <div>Combo Breaker: K / Right Click</div>
            <div>Transportation: L / Shift</div>
        </div>
        <!-- Loading Screen -->
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-text">Loading Adriel's Game - UFO Adventures...</div>
            <button class="start-button" id="startGameButton">Start Adventure</button>
            <button class="start-button" id="startBossFightButton">Fight Tarak Boss</button>
            <button class="start-button" id="startEnemyDemoButton">Enemy Demo</button>
        </div>
    </div>
    <!-- JS scripts -->
    <script src="js/engine/core.js?v=1"></script>
    <script src="js/engine/components.js?v=1"></script>
    <script src="js/engine/systems.js?v=1"></script>
    <script src="js/engine/utils.js?v=1"></script>
    <script src="js/entities/player.js?v=1"></script>
    <script src="js/ui.js?v=1"></script>
    <script src="js/game.js?v=1"></script>
    <script src="js/main.js?v=1"></script>
</body>
</html>
