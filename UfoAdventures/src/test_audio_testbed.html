<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Service Testbed</title>
    <style>
        body { background: #04060d; color: #e4ebff; font-family: sans-serif; }
        .wrap { max-width: 840px; margin: 2rem auto; padding: 1.5rem 2rem; background: #111a2e; border-radius: 12px; }
        button { margin: 0.5rem 0.75rem 0.5rem 0; padding: 0.6rem 1rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .log { margin-top: 1rem; background: rgba(0,0,0,0.35); padding: 1rem; border-radius: 8px; min-height: 120px; max-height: 240px; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.9rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Audio Service Testbed</h1>
        <p>Exercise the production <code>AudioService</code> API with placeholder assets.</p>
        <div>
            <button id="play-bgm">Play Background Music</button>
            <button id="stop-bgm">Stop Music</button>
            <button id="play-ability">Play Ability SFX</button>
            <button id="play-boss">Play Boss Cue</button>
        </div>
        <div class="log" id="audio-log"></div>
    </div>

    <script src="js/engine/audio-service.js?v=1"></script>
    <script>
        const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
        const audioLog = document.getElementById('audio-log');
        const audioService = new AudioService();

        function log(message) {
            const stamp = new Date().toLocaleTimeString();
            audioLog.textContent = `[${stamp}] ${message}\n` + audioLog.textContent;
        }

        audioService.configure({
            music: [
                { alias: 'music_main_theme', src: SILENCE, loop: true, volume: 0.5 }
            ],
            sfx: [
                { alias: 'sfx_combo_breaker', src: SILENCE, volume: 0.8 },
                { alias: 'sfx_boss_phase_shift', src: SILENCE, volume: 0.8 }
            ]
        }, { music: 'on', sfx: 'on' }).then(() => {
            log('AudioService configured');
        }).catch(error => {
            log('Failed to configure AudioService: ' + error.message);
        });

        document.getElementById('play-bgm').addEventListener('click', () => {
            audioService.playMusic('music_main_theme', { loop: true });
            log('playMusic(music_main_theme)');
        });
        document.getElementById('stop-bgm').addEventListener('click', () => {
            audioService.stopMusic();
            log('stopMusic()');
        });
        document.getElementById('play-ability').addEventListener('click', () => {
            audioService.playSound('sfx_combo_breaker');
            log('playSound(sfx_combo_breaker)');
        });
        document.getElementById('play-boss').addEventListener('click', () => {
            audioService.playSound('sfx_boss_phase_shift');
            log('playSound(sfx_boss_phase_shift)');
        });
    </script>
</body>
</html>
