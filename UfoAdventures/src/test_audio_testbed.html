<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Service Testbed</title>
    <style>
        body { background: #04060d; color: #e4ebff; font-family: sans-serif; }
        .wrap { max-width: 840px; margin: 2rem auto; padding: 1.5rem 2rem; background: #111a2e; border-radius: 12px; }
        button { margin: 0.5rem 0.75rem 0.5rem 0; padding: 0.6rem 1rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .log { margin-top: 1rem; background: rgba(0,0,0,0.35); padding: 1rem; border-radius: 8px; min-height: 120px; max-height: 240px; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Audio Service Testbed</h1>
        <p>Temporary harness to drive the future `AudioService` API via button clicks before integration into the runtime.</p>
        <div>
            <button id="play-bgm">Play Background Music</button>
            <button id="stop-bgm">Stop Music</button>
            <button id="play-ability">Play Ability SFX</button>
            <button id="play-boss">Play Boss Cue</button>
        </div>
        <div class="log" id="audio-log"></div>
    </div>

    <script>
        class StubAudioService {
            constructor(logCb) {
                this.log = logCb;
                this.bgm = null;
            }
            playMusic(track) {
                this.bgm = track;
                this.log(`playMusic(${track})`);
            }
            stopMusic() {
                this.log('stopMusic()');
                this.bgm = null;
            }
            playSound(alias, options = {}) {
                this.log(`playSound(${alias}, ${JSON.stringify(options)})`);
            }
        }

        const logEl = document.getElementById('audio-log');
        function log(message) {
            const stamp = new Date().toLocaleTimeString();
            logEl.textContent += `[${stamp}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const audio = new StubAudioService(log);

        document.getElementById('play-bgm').addEventListener('click', () => audio.playMusic('bgm_space_loop'));
        document.getElementById('stop-bgm').addEventListener('click', () => audio.stopMusic());
        document.getElementById('play-ability').addEventListener('click', () => audio.playSound('ability_combo_breaker', { volume: 0.75 }));
        document.getElementById('play-boss').addEventListener('click', () => audio.playSound('boss_phase_shift', { volume: 1.0 }));
    </script>
</body>
</html>
